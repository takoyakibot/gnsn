name: キャラ属性データの更新

# genshin-db から data/characters.json を作り直し、差分があれば PR を出す。
#
# main へ直接コミットはしない。ビルドは属性の取得漏れ・別名の参照切れ・照合キーの
# 衝突なら失敗するが、「新キャラが増えただけ」は正常に成功する。つまり見慣れない
# 名前が黙って main に入りうるので、差分を見てからマージする形にしている。
#
# ゲーム内で新キャラが実装されても、genshin-db 側のデータが更新されるまでは
# ここを回しても空振りになる。上流がいつ公開するかは制御できないので、実装直後を
# 狙って回すのではなく、短い間隔で拾いに行く方針にしている。週次なら上流の遅れと
# 合算しても ? が残る期間が長引きにくい（月次だと 5〜6 週間になりうる）。
# 差分がなければ PR を作らずに終わるため、空振りの回は無害。
#
# 注意: cron はリポジトリが 60 日無活動だと GitHub 側で自動停止される。
# workflow_dispatch を併設してあるので、停止に気づいたら手動でも回せる。

on:
  schedule:
    - cron: '20 0 * * 1' # 毎週月曜 09:20 JST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-characters-data
  cancel-in-progress: false

env:
  BRANCH: chore/update-characters-data

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 更新前のデータを退避
        run: cp data/characters.json "$RUNNER_TEMP/before.json"

      - name: データを再生成
        run: npm run build:data

      - name: テスト
        run: npm test

      - name: 差分を判定
        id: diff
        run: |
          if git diff --quiet -- data/characters.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "データに変化なし。PR は作らない。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: PR 本文を組み立てる
        if: steps.diff.outputs.changed == 'true'
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const before = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/before.json", "utf8"));
            const after = JSON.parse(readFileSync("data/characters.json", "utf8"));
            const added = Object.keys(after).filter((k) => !(k in before));
            const removed = Object.keys(before).filter((k) => !(k in after));
            const changed = Object.keys(after).filter(
              (k) => k in before && JSON.stringify(before[k]) !== JSON.stringify(after[k]),
            );
            const list = (names) =>
              names.map((n) => `- \`${n}\` — ${after[n] ? [after[n].element, after[n].weapon, "★" + after[n].rarity].join(" / ") : "（削除）"}`).join("\n");
            const section = (heading, lines) => (lines.length ? ["", heading, "", lines] : []);
            const parts = [
              "genshin-db からキャラ属性データを再生成した。",
              "",
              `全 ${Object.keys(after).length} 件（前回 ${Object.keys(before).length} 件）。`,
              ...section(`### 追加 ${added.length} 件`, added.length ? [list(added)] : []),
              ...section(`### 属性が変わった ${changed.length} 件`, changed.length ? [list(changed)] : []),
              ...section(`### 消えた ${removed.length} 件`, removed.map((n) => `- \`${n}\``)),
              "",
              "### 確認すること",
              "",
              "- 追加された名前が HoYoLAB の「全キャラクター」画面の表記と一致しているか。",
              "  ずれていれば `tools/aliases.json` に `\"HoYoLAB の表記\": \"genshin-db の表記\"` を足す。",
              "- 元素可変キャラが `可変` になっているか（`無` のまま出ていないか）。",
              "",
              "全角半角・異体字といった機械的な揺れは `names.js` の `matchKey()` が吸収するため、",
              "別名テーブルに足す必要はない。",
            ];
            writeFileSync(process.env.RUNNER_TEMP + "/pr-body.md", parts.flat().join("\n") + "\n");
          '

      - name: ブランチへ push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add data/characters.json
          git commit -m "キャラ属性データを再生成"
          git push --force-with-lease origin "$BRANCH"

      - name: PR を作る（既にあれば本文を更新）
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/pr-body.md"
            echo "既存の PR を更新した。"
          else
            gh pr create \
              --head "$BRANCH" \
              --title "キャラ属性データを再生成" \
              --body-file "$RUNNER_TEMP/pr-body.md"
          fi
