<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="所持キャラ名鑑">
  <!-- maskable 用。端末側で円などに切り抜かれるため、図案を中央 80% の
       セーフゾーンに収めてある。背景は全面塗り。 -->
  <rect width="512" height="512" fill="#23211e"/>
  <g transform="translate(256 256) scale(0.72) translate(-256 -301)">
    <rect x="84"  y="250" width="44" height="150" rx="8" fill="#f0705a"/>
    <rect x="144" y="200" width="44" height="200" rx="8" fill="#5cb2e8"/>
    <rect x="204" y="230" width="44" height="170" rx="8" fill="#7ec93f"/>
    <rect x="264" y="180" width="44" height="220" rx="8" fill="#b985ea"/>
    <rect x="324" y="215" width="44" height="185" rx="8" fill="#61cbe0"/>
    <rect x="384" y="240" width="44" height="160" rx="8" fill="#dcb43f"/>
    <rect x="64"  y="400" width="384" height="22" rx="11" fill="#cbb98f"/>
  </g>
</svg>
