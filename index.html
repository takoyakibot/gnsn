<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>所持キャラ名鑑</title>
    <meta name="description" content="HoYoLAB の全キャラクター画面を貼り付けて、所持キャラだけを並べて眺めるツール" />
    <style>
      :root {
        --bg: #f4f2ee;
        --panel: #fffdfa;
        --line: #ddd7cc;
        --ink: #2a2723;
        --muted: #7c756a;
        --accent: #6b5b3e;
        --radius: 10px;

        --el-炎: #d9482a;
        --el-水: #2f86c4;
        --el-風: #1ea888;
        --el-雷: #8f52c9;
        --el-草: #4a9c17;
        --el-氷: #3aa5bd;
        --el-岩: #b0850f;
        --el-可変: #8a8378;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1917;
          --panel: #23211e;
          --line: #38342e;
          --ink: #ece7de;
          --muted: #9b9284;
          --accent: #cbb98f;

          --el-炎: #f0705a;
          --el-水: #5cb2e8;
          --el-風: #45d3b4;
          --el-雷: #b985ea;
          --el-草: #7ec93f;
          --el-氷: #61cbe0;
          --el-岩: #dcb43f;
          --el-可変: #a49c8f;
        }
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
        line-height: 1.6;
        font-size: 15px;
      }
      .wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 64px; }

      header h1 { font-size: 1.35rem; margin: 0 0 2px; letter-spacing: .02em; }
      header p { margin: 0 0 20px; color: var(--muted); font-size: .85rem; }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 14px 16px;
        margin-bottom: 16px;
      }
      .panel h2 {
        font-size: .82rem; text-transform: none; letter-spacing: .06em;
        margin: 0 0 10px; color: var(--muted); font-weight: 600;
      }

      textarea {
        width: 100%; min-height: 160px; resize: vertical;
        background: var(--bg); color: var(--ink);
        border: 1px solid var(--line); border-radius: 6px;
        padding: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: .82rem; line-height: 1.5;
      }
      textarea:focus, button:focus-visible, select:focus-visible {
        outline: 2px solid var(--accent); outline-offset: 1px;
      }

      button {
        font: inherit; font-size: .85rem; cursor: pointer;
        background: var(--panel); color: var(--ink);
        border: 1px solid var(--line); border-radius: 6px;
        padding: 5px 12px;
      }
      button:hover { border-color: var(--accent); }
      button.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
      @media (prefers-color-scheme: dark) { button.primary { color: #1a1917; } }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }

      .note { font-size: .8rem; color: var(--muted); margin: 6px 0 0; }
      .warn {
        border-left: 3px solid var(--el-岩); background: color-mix(in srgb, var(--el-岩) 8%, transparent);
        padding: 8px 12px; border-radius: 0 6px 6px 0; margin-top: 10px; font-size: .82rem;
      }
      .warn code {
        font-family: ui-monospace, monospace; font-size: .95em;
        background: color-mix(in srgb, var(--ink) 8%, transparent);
        padding: 1px 5px; border-radius: 3px; margin: 0 2px; display: inline-block;
      }

      .stats { display: flex; gap: 18px; flex-wrap: wrap; }
      .stat b { font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; }
      .stat span { display: block; font-size: .72rem; color: var(--muted); letter-spacing: .04em; }

      .chips { display: flex; gap: 6px; flex-wrap: wrap; }
      .chip {
        font-size: .8rem; padding: 3px 11px; border-radius: 999px;
        border: 1px solid var(--line); background: transparent; color: var(--muted);
      }
      .chip[aria-pressed="true"] {
        background: var(--el, var(--accent)); border-color: var(--el, var(--accent));
        color: #fff; font-weight: 600;
      }
      .filter-group { margin-bottom: 10px; }
      .filter-group > label { font-size: .74rem; color: var(--muted); display: block; margin-bottom: 5px; }
      select {
        font: inherit; font-size: .85rem; padding: 4px 8px;
        background: var(--panel); color: var(--ink);
        border: 1px solid var(--line); border-radius: 6px;
      }

      .grid {
        display: grid; gap: 8px;
        grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      }
      .card {
        text-align: left; padding: 9px 11px; border-radius: 8px;
        background: var(--panel); border: 1px solid var(--line);
        border-left: 4px solid var(--el, var(--el-可変));
        display: flex; flex-direction: column; gap: 2px;
      }
      .card:hover { border-color: var(--accent); border-left-color: var(--el, var(--el-可変)); }
      .card[aria-pressed="true"] {
        box-shadow: inset 0 0 0 2px var(--accent);
      }
      .card .name { font-weight: 600; font-size: .93rem; line-height: 1.3; }
      .card .meta { font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
      .card .el { color: var(--el, var(--muted)); font-weight: 600; }
      .card.unknown { border-left-style: dashed; }

      .team { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
      .slot {
        min-height: 62px; border: 1px dashed var(--line); border-radius: 8px;
        padding: 8px; font-size: .82rem; display: flex; flex-direction: column;
        justify-content: center; color: var(--muted);
      }
      .slot.filled {
        border-style: solid; color: var(--ink);
        border-left: 4px solid var(--el, var(--el-可変));
      }
      .slot .name { font-weight: 600; }
      .resonance { margin-top: 10px; font-size: .85rem; }
      .resonance .none { color: var(--muted); }

      footer {
        margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line);
        font-size: .74rem; color: var(--muted);
      }
      footer p { margin: 2px 0; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>所持キャラ名鑑</h1>
        <p>HoYoLAB の「全キャラクター」画面をコピーして貼り付けると、所持キャラだけが並びます。</p>
      </header>

      <section class="panel" id="import-panel">
        <h2>取り込み</h2>
        <textarea
          id="input"
          placeholder="HoYoLAB 戦績ツールの「全キャラクター」画面を全選択してコピーし、ここに貼り付け。PC 版・スマホ版のどちらの形式でも読めます。"
          spellcheck="false"
        ></textarea>
        <div class="row">
          <button class="primary" id="parse-btn" type="button">解析する</button>
          <button id="cancel-btn" type="button" hidden>やめる</button>
          <span class="note" id="import-note"></span>
        </div>
      </section>

      <section class="panel" id="status-panel" hidden>
        <h2>取り込み結果</h2>
        <div class="stats" id="stats"></div>
        <div class="row">
          <button id="reimport-btn" type="button">貼り直す</button>
          <button id="clear-btn" type="button">消去</button>
          <span class="note" id="status-note"></span>
        </div>
        <div class="warn" id="unknown-box" hidden></div>
      </section>

      <section class="panel" id="filter-panel" hidden>
        <h2>絞り込み</h2>
        <div class="filter-group">
          <label id="lbl-element">元素</label>
          <div class="chips" id="element-filter" role="group" aria-labelledby="lbl-element"></div>
        </div>
        <div class="filter-group">
          <label id="lbl-weapon">武器種</label>
          <div class="chips" id="weapon-filter" role="group" aria-labelledby="lbl-weapon"></div>
        </div>
        <div class="row">
          <label for="sort" class="note">並び順</label>
          <select id="sort">
            <option value="level">レベル順</option>
            <option value="constellation">凸順</option>
            <option value="element">元素順</option>
            <option value="rarity">レアリティ順</option>
            <option value="name">名前順</option>
          </select>
          <button id="reset-filter" type="button">絞り込み解除</button>
          <span class="note" id="filter-count"></span>
        </div>
      </section>

      <section class="panel" id="team-panel" hidden>
        <h2>編成メモ</h2>
        <div class="team" id="team"></div>
        <div class="resonance" id="resonance"></div>
      </section>

      <section id="shelf-section" hidden>
        <div class="grid" id="shelf"></div>
      </section>

      <footer>
        <p>このサイトはHoYoverseと提携していません。</p>
        <p>原神およびゲームコンテンツ・素材はHoYoverseの商標および著作権です。</p>
      </footer>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
